name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-secret-scan:
    name: Lint & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff Lint
        run: ruff check .

  test-and-coverage:
    name: Unit Tests & Safety Coverage (No GPU / No Raw Data Required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install hypothesis pytest-cov
          pip install -e .
      - name: Run Tests with Coverage on src/t2s/safety
        run: |
          pytest tests/ --ignore=tests/test_fuzz_validator.py --ignore=tests/test_parser_differential.py --cov=src/t2s/safety --cov-fail-under=80 -q
      - name: Run Phase 2 Security & Policy Hash Verification
        run: python scripts/check_phase2.py

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Demo Image
        run: |
          docker build -t text2sql-assistant:test .
      - name: Run Container Smoke Test
        run: |
          docker run -d --name test-container -p 7860:7860 -e MODEL_BACKEND=mock text2sql-assistant:test
          sleep 5
          docker logs test-container
          curl -f http://localhost:7860/healthz || exit 1
          curl -f http://localhost:7860/ready || exit 1
          docker stop test-container

