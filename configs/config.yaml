seed: 42
paths:
  raw_data_dir: "data/raw/spider"
  processed_data_dir: "data/processed"
  reports_dir: "reports"
  models_dir: "models"
split:
  val_db_ratio: 0.10
model:
  base_model_name: "Qwen/Qwen2.5-Coder-3B-Instruct"
  fallback_model_name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  max_seq_len: 1024
generation:
  do_sample: false
  temperature: 0.0
  max_new_tokens: 256
  include_sample_rows: false

self_correction:
  enabled: false
  max_retries: 2

voting:
  enabled: false
  n: 5
  temperature: 0.7
  per_candidate_timeout_seconds: 3.0
  total_budget_seconds: 15.0
  max_concurrent: 4
serving:
  max_concurrent_generations: 1
  max_queue_depth: 10
  request_timeout_seconds: 30.0
  max_tokens_cap: 256
  max_request_bytes: 65536
  global_rate_limit_per_minute: 60
  enable_metrics_auth: false
