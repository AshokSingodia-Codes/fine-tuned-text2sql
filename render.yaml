services:
  - type: web
    name: text2sql-api
    runtime: python
    region: oregon
    plan: free
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.t2s.serving.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_BACKEND
        value: mock
      - key: APP_PROFILE
        value: demo
      # Demo allowlist: only expose a curated set of databases publicly
      # Prevents exposing all 166 Spider DBs in the live demo
      - key: DEMO_DB_ALLOWLIST
        value: "concert_singer,student_assessment,pets_1,chinook_1"
      - key: DISABLE_AUTH
        value: "true"
      - key: PYTHONPATH
        value: .
      # Uploaded DBs persist inside db/uploads/ in the repo
      # This dir is gittracked (with .gitkeep) so it survives Render deploys
      - key: DB_DIR
        value: data/raw/spider/database
