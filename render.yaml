services:
  - type: web
    name: text2sql-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn src.t2s.serving.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_BACKEND
        value: mock
      - key: APP_PROFILE
        value: demo
      - key: DISABLE_AUTH
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
